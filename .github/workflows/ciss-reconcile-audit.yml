name: CISS Reconciliation Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "baseline/**"
      - "config/ciss_contract_v1.json"
      - "config/revision_policy_v1.json"
      - "src/acquire.py"
      - "src/validate.py"
      - "src/reconcile.py"
      - "src/reconcile_run.py"
      - "src/model_stress.py"
      - ".github/workflows/ciss-reconcile-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Run full-history official ECB reconciliation audit
        run: python -m src.reconcile_run --output-dir artifacts/reconciliation

      - name: Show reconciliation summary and enforce governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("artifacts/reconciliation/reconciliation.json").read_text())
          summary = {
              "reconciliation_status": r["revision_summary"]["status"],
              "revision_governance_status": r["revision_governance"]["status"],
              "revision_fingerprint_match": r["revision_governance"]["fingerprint_match"],
              "revision_count": r["revision_summary"]["revision_count"],
              "classification_change_count": r["model_impact"]["classification_change_count"],
              "official_last_observation": r["validation"]["official_last_observation"],
              "publication_gate": r["publication_gate"],
          }
          print(json.dumps(summary, indent=2))
          if r["publication_gate"] != "ELIGIBLE_FOR_NEXT_GATES":
              raise SystemExit("revision governance gate is not eligible for next gates")
          PY

      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ciss-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/reconciliation
          if-no-files-found: error
          retention-days: 14
