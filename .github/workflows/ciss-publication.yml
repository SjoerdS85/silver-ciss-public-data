name: CISS Publication

on:
  pull_request:
    branches: [main]
    paths:
      - "baseline/**"
      - "config/**"
      - "src/**"
      - "tests/test_publication.py"
      - ".github/workflows/ciss-publication.yml"
  workflow_dispatch:
    inputs:
      confirm_release_immutability_enabled:
        description: "Release immutability is enabled in repository Settings"
        required: true
        type: boolean
        default: false
      confirm_pages_actions_enabled:
        description: "GitHub Pages source is configured for GitHub Actions"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Build validated publication snapshot
        run: python -m src.build_publication --output-dir artifacts/publication

      - name: Display publication summary
        run: cat artifacts/publication/publication_summary.json

      - name: Upload publication candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ciss-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publication
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_release_immutability_enabled == true &&
      inputs.confirm_pages_actions_enabled == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      snapshot_sha: ${{ steps.snapshot.outputs.snapshot_sha }}
    steps:
      - name: Checkout repository for snapshot commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Download publication candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ciss-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ciss-publication

      - name: Read release tag
        id: meta
        shell: bash
        run: |
          TAG="$(tr -d '\n\r' < "$RUNNER_TEMP/ciss-publication/tag.txt")"
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Refuse duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

      - name: Create data-only snapshot commit
        id: snapshot
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          SNAP_BRANCH="snapshot-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$SNAP_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/ciss-publication/connector_tree/." .
          test -f connector_snapshot/connector_attestation.json
          test -f connector_snapshot/ciss_snapshot_manifest.json
          test -f connector_snapshot/ciss_snapshot.csv
          test -f connector_snapshot/revision_report.csv
          git add connector_snapshot
          git commit -m "Immutable CISS connector snapshot $TAG"
          SNAPSHOT_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$SNAP_BRANCH"
          echo "snapshot_sha=$SNAPSHOT_SHA" >> "$GITHUB_OUTPUT"
          echo "staging_branch=$SNAP_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create immutable release on snapshot commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          SNAPSHOT_SHA: ${{ steps.snapshot.outputs.snapshot_sha }}
        run: |
          gh release create "$TAG"             "$RUNNER_TEMP/ciss-publication/ciss_snapshot.csv"             "$RUNNER_TEMP/ciss-publication/ciss_snapshot_manifest.json"             "$RUNNER_TEMP/ciss-publication/revision_report.csv"             "$RUNNER_TEMP/ciss-publication/connector_attestation.json"             --repo "$GITHUB_REPOSITORY"             --target "$SNAPSHOT_SHA"             --title "$TAG"             --notes-file "$RUNNER_TEMP/ciss-publication/release_notes.md"

      - name: Verify immutable release, tag target and asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          SNAPSHOT_SHA: ${{ steps.snapshot.outputs.snapshot_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "ciss-publication"
          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release.json").read_text())
          if release.get("immutable") is not True:
              raise SystemExit("release immutability verification failed")

          expected = {}
          for name in [
              "ciss_snapshot.csv",
              "ciss_snapshot_manifest.json",
              "revision_report.csv",
              "connector_attestation.json",
          ]:
              expected[name] = "sha256:" + hashlib.sha256((root / name).read_bytes()).hexdigest()

          observed = {a["name"]: a.get("digest") for a in release.get("assets", [])}
          if observed != expected:
              raise SystemExit(f"release asset digest mismatch: observed={observed} expected={expected}")
          print("immutable release asset digests verified")
          PY

          REF_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
          REF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          if [ "$REF_TYPE" = "tag" ]; then
            REF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$REF_SHA" --jq '.object.sha')"
          fi
          test "$REF_SHA" = "$SNAPSHOT_SHA"
          echo "immutable tag resolves to snapshot commit $SNAPSHOT_SHA"

      - name: Verify tagged-tree files through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for NAME in connector_attestation.json ciss_snapshot_manifest.json ciss_snapshot.csv revision_report.csv; do
            gh api --method GET               -H "Accept: application/vnd.github.raw+json"               "repos/$GITHUB_REPOSITORY/contents/connector_snapshot/$NAME"               -f "ref=$TAG" > "$RUNNER_TEMP/remote-$NAME"
            cmp "$RUNNER_TEMP/remote-$NAME" "$RUNNER_TEMP/ciss-publication/connector_tree/connector_snapshot/$NAME"
          done
          echo "tagged-tree read-back verified"

      - name: Remove temporary snapshot branch
        if: success()
        env:
          SNAP_BRANCH: ${{ steps.snapshot.outputs.staging_branch }}
        run: git push origin --delete "$SNAP_BRANCH"

  pages:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_release_immutability_enabled == true &&
      inputs.confirm_pages_actions_enabled == true
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download publication candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ciss-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publication

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: artifacts/publication/site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
