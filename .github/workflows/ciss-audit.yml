name: CISS Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Acquire official ECB full and tail payloads
        run: python -m src.acquire --output-dir artifacts/acquisition
      - name: Upload audit payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ciss-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/acquisition
          if-no-files-found: error
          retention-days: 14
